version: '3.6'

services:
  operately:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: operately-development
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OPERATELY_BLOB_TOKEN_SECRET_KEY=${OPERATELY_BLOB_TOKEN_SECRET_KEY}
      - SYSTEM_SETTINGS_ENCRYPTION_KEYS=${SYSTEM_SETTINGS_ENCRYPTION_KEYS}
      - OPERATELY_HOST=${OPERATELY_HOST}
      - OPERATELY_URL_SCHEME=${OPERATELY_URL_SCHEME}
      - ALLOW_LOGIN_WITH_EMAIL=${ALLOW_LOGIN_WITH_EMAIL}
      - ALLOW_SIGNUP_WITH_EMAIL=${ALLOW_SIGNUP_WITH_EMAIL}
    ports:
      - 4000:4000
    volumes:
      - ./data/operately:/media
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:14.5
    restart: unless-stopped
    environment:
      - POSTGRES_USER=operately
      - POSTGRES_PASSWORD=operately
      - POSTGRES_DB=operately
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
